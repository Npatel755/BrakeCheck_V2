# XcodeGen spec for an Xcode app target around the BrakeCheck Swift package.
# xtool doesn't need this; CI uses it to build an installable .ipa (and later the
# App Store archive). Generated files (the .xcodeproj, Info.plist, Assets.xcassets)
# are created on CI and not committed. See .github/workflows/ios-ipa.yml.
name: BrakeCheckApp
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  BrakeCheck:
    path: ..
targets:
  BrakeCheckApp:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - Entry
    dependencies:
      - package: BrakeCheck
        product: BrakeCheck
    settings:
      base:
        PRODUCT_NAME: BrakeCheck
        # The package's module is already called BrakeCheck; two modules with one name collide.
        PRODUCT_MODULE_NAME: BrakeCheckApp
        PRODUCT_BUNDLE_IDENTIFIER: com.brakecheck.prototype
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # A one-file target would otherwise be compiled as a script with its own main().
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
