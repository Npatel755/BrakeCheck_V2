# XcodeGen spec for an Xcode app target around the BrakeCheck Swift package, plus a UI test
# that photographs the main screens in the Simulator. xtool doesn't need this; CI uses it
# (.github/workflows/ios-screens.yml). The generated files (the .xcodeproj, Info.plist,
# Assets.xcassets) are created on CI and not committed.
name: BrakeCheckApp
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  BrakeCheck:
    path: ..
targets:
  BrakeCheckApp:
    type: application
    platform: iOS
    sources:
      - Entry
    dependencies:
      - package: BrakeCheck
        product: BrakeCheck
    scheme:
      testTargets:
        - BrakeCheckUITests
    settings:
      base:
        PRODUCT_NAME: BrakeCheck
        # The package's module is already called BrakeCheck; two modules with one name collide.
        PRODUCT_MODULE_NAME: BrakeCheckApp
        PRODUCT_BUNDLE_IDENTIFIER: com.brakecheck.prototype
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # A one-file target would otherwise be compiled as a script with its own main().
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
  BrakeCheckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: BrakeCheckApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brakecheck.prototype.uitests
        TEST_TARGET_NAME: BrakeCheckApp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
