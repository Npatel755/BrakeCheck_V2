# Signs the Release app and uploads it to TestFlight from a GitHub-hosted Mac.
# Runs when a commit on a claude/* branch has "[testflight]" in its message, or manually
# from the Actions tab (manual runs only appear once this file is on the default branch).
#
# One-time setup (repo Settings → Secrets and variables → Actions; only the repo owner can do this):
#   secrets   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect → Users and Access → Integrations
#             ASC_KEY_P8                  full text of the AuthKey_<id>.p8 file (role: Admin, so
#                                         Xcode can use cloud-managed signing certificates)
#   variables APPLE_TEAM_ID               developer.apple.com/account → Membership details
#             BUNDLE_ID                   must match the app record in App Store Connect
name: iOS TestFlight upload

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
    steps:
      - name: Check the signing setup
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID BUNDLE_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=TestFlight setup missing::Add these in Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Generate the Xcode app project
        run: |
          brew install xcodegen
          python3 - <<'PY'
          import os, pathlib
          # The real bundle ID; set here, not on the xcodebuild command line, because a
          # command-line value would also land on the package's resource bundles.
          spec = pathlib.Path("AppTarget/project.yml")
          text = spec.read_text()
          old = "PRODUCT_BUNDLE_IDENTIFIER: com.brakecheck.prototype"
          assert old in text, "project.yml bundle ID line changed; update ios-testflight.yml"
          spec.write_text(text.replace(old, "PRODUCT_BUNDLE_IDENTIFIER: " + os.environ["BUNDLE_ID"]))
          # Release turns the trained lane models off (AppScope.neuralLanes). Their weights must
          # not ship: SegFormer's licence is non-commercial and UFLD was trained on CULane
          # (non-commercial). Leave them out before signing rather than strip them after.
          package = pathlib.Path("Package.swift")
          text = package.read_text()
          copy = '.copy("Resources/LaneModelData"),'
          exclude = '"Resources/YOLOModelData"'
          assert copy in text and exclude in text, "Package.swift lane lines changed; update ios-testflight.yml"
          text = text.replace(copy, "").replace(exclude, exclude + ',\n                "Resources/LaneModelData"')
          package.write_text(text)
          PY
          bash scripts/generate_app_project.sh
          # Each upload needs a higher build number; 40 was the last hand-set one.
          build=$((100 + GITHUB_RUN_NUMBER))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" AppTarget/Info.plist
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"

      - name: Write the App Store Connect key
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive (Release, signed)
        run: |
          set +e
          xcodebuild -project AppTarget/BrakeCheckApp.xcodeproj -scheme BrakeCheckApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/BrakeCheck.xcarchive -derivedDataPath build/dd -skipPackagePluginValidation \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic archive > archive.log 2>&1
          status=$?
          grep -E "error:" archive.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -30 | while IFS= read -r line; do echo "::error title=xcodebuild archive::$line"; done
          [ $status -ne 0 ] && tail -30 archive.log | while IFS= read -r line; do echo "::notice title=archive.log tail::$line"; done
          exit $status

      - name: Check what ships
        run: |
          app=build/BrakeCheck.xcarchive/Products/Applications/BrakeCheck.app
          test -d "$app"
          if find "$app" -name "*.mlpackage" -path "*LaneModelData*" | grep -q .; then echo "::error::Lane models are in the app"; exit 1; fi
          for size in Day Night; do
            find "$app" -path "*DetectorModelData/$size/*" -name 0-weight.bin | grep -q . \
              || { echo "::error::$size detector weights are missing"; exit 1; }
          done
          id=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist")
          [ "$id" = "$BUNDLE_ID" ] || { echo "::error::Bundle ID is $id, expected $BUNDLE_ID"; exit 1; }

      - name: Export and upload to TestFlight
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set +e
          xcodebuild -exportArchive -archivePath build/BrakeCheck.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1
          status=$?
          grep -E "error:|Error" export.log | sort -u | head -30 | while IFS= read -r line; do echo "::error title=upload::$line"; done
          [ $status -ne 0 ] && tail -30 export.log | while IFS= read -r line; do echo "::notice title=export.log tail::$line"; done
          [ $status -eq 0 ] && echo "::notice title=Uploaded to TestFlight::build $BUILD_NUMBER, commit ${GITHUB_SHA::7}. Apple takes 5-30 min to process it."
          exit $status

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log
